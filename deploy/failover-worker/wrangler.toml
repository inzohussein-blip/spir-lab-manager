# Cloudflare Worker: one address in front of the main site and its standby (docs/NETLIFY_STANDBY.md).
# Deploy from this folder with:  npx wrangler deploy
# Or paste worker.mjs into a new Worker in the Cloudflare dashboard and set the two variables there.

name = "spir-lab"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# The two copies of the site, without a trailing slash. Replace with your own addresses.
PRIMARY = "https://spir-lab-manager.vercel.app"
BACKUP = "https://spir-lab-manager.netlify.app"
