# The site's second standby on your own computer or a rented server (docs/SELF_HOST_STANDBY.md).
# The settings are in .env next to this file (copy .env.example); start and update with update.sh
# (Linux / macOS) or update.cmd (Windows), which keep it on the same version as the main site.
name: spir-lab-standby

services:
  app:
    build:
      context: ../..
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?set NEXT_PUBLIC_BASE_URL in .env}
        NEXT_PUBLIC_STATION_SYNC: ${NEXT_PUBLIC_STATION_SYNC:-}
    env_file: .env
    environment:
      # The same database as the main site, or the standby would show other data.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
    volumes:
      - lab-data:/data
    # Only on this machine: the way in from the internet is the tunnel (Tailscale Funnel or
    # Cloudflare Tunnel), not an open port.
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  lab-data:
