# Weekly check of the libraries the site runs on for known security holes.
# A red run (GitHub emails the repository owner) means: update the library it names.
name: Security audit

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  push:
    paths: [package.json, package-lock.json]
  pull_request:
    paths: [package.json, package-lock.json]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Known vulnerabilities in the site's libraries (high or critical)
        run: npm audit --omit=dev --audit-level=high
