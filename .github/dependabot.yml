# Library updates: one grouped Pull Request a month into main, minor and patch versions only —
# major versions (breaking changes) are upgraded by hand with the full tests, like Next.js 16.
# Security holes are also caught by the weekly audit (workflows/security.yml).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
